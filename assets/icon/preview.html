<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合德本地生活 - 小程序图标预览</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #C1121F;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }
        .icon-item {
            padding: 20px;
            border-radius: 10px;
            background: #f8f9fa;
        }
        .icon-item img, .icon-item svg {
            width: 100%;
            height: auto;
        }
        .icon-label {
            margin-top: 10px;
            color: #333;
            font-size: 14px;
        }
        .download-btn {
            background: linear-gradient(135deg, #E63946 0%, #C1121F 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 30px;
            transition: transform 0.2s;
        }
        .download-btn:hover {
            transform: scale(1.05);
        }
        .features {
            margin-top: 40px;
            text-align: left;
            background: #fff5f5;
            padding: 20px;
            border-radius: 10px;
        }
        .features h3 {
            color: #C1121F;
            margin-top: 0;
        }
        .features ul {
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧧 合德本地生活</h1>
        <p class="subtitle">春节版小程序图标 (64×64px)</p>

        <div class="icon-item">
            <img src="hede-cny-icon.png" alt="合德本地生活图标" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" style="display:none; width: 128px; height: 128px; margin: 0 auto;">
                <defs>
                    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#E63946"/>
                        <stop offset="100%" style="stop-color:#C1121F"/>
                    </linearGradient>
                    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#FF6B35"/>
                        <stop offset="100%" style="stop-color:#F7931E"/>
                    </linearGradient>
                </defs>
                <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#bgGradient)"/>
                <rect x="4" y="4" width="56" height="56" rx="10" fill="none" stroke="#FFD700" stroke-width="1.5"/>
                <g transform="translate(32, 26)">
                    <circle cx="0" cy="0" r="14" fill="url(#sunGradient)" opacity="0.9"/>
                    <path d="M -3,-8 L 0,-12 L 3,-8 L 0,-4 Z" fill="#FFD700"/>
                    <path d="M 0,-12 L 0,3" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
                    <path d="M -2,0 L 0,4 L 2,0" fill="#FFD700"/>
                </g>
                <g transform="translate(32, 9)">
                    <ellipse cx="0" cy="0" rx="3" ry="4" fill="#DC2626"/>
                    <rect x="-1" y="-5" width="2" height="2" fill="#FFD700"/>
                    <rect x="-1.5" y="4" width="3" height="1.5" fill="#FFD700" rx="0.5"/>
                </g>
                <g transform="translate(14, 46)">
                    <path d="M -4,0 Q 0,-3 4,0 L 3,4 Q 0,5 -3,4 Z" fill="#FFD700" stroke="#C1121F" stroke-width="0.5"/>
                </g>
                <g transform="translate(26, 46)">
                    <path d="M 0,-3 L -4,1 L -3,1 L -3,4 L 3,4 L 3,1 L 4,1 Z" fill="#FFD700" stroke="#C1121F" stroke-width="0.5"/>
                </g>
                <g transform="translate(38, 46)">
                    <path d="M -3,-2 L 3,-2 L 4,3 L -3,3 Z" fill="#FFD700" stroke="#C1121F" stroke-width="0.5"/>
                </g>
                <g transform="translate(50, 46)">
                    <rect x="-3" y="-2" width="6" height="5" fill="#FFD700" stroke="#C1121F" stroke-width="0.5" rx="0.5"/>
                    <path d="M -1.5,-2 L -1.5,3" stroke="#C1121F" stroke-width="0.5"/>
                </g>
                <g transform="translate(54, 10)">
                    <circle cx="0" cy="0" r="5" fill="#DC2626" stroke="#FFD700" stroke-width="1"/>
                    <text x="0" y="2" font-size="6" fill="#FFD700" text-anchor="middle" font-weight="bold">¥</text>
                </g>
                <text x="32" y="59" font-size="5" fill="#FFD700" text-anchor="middle">合德生活</text>
            </svg>
            <p class="icon-label">春节版图标</p>
        </div>

        <div class="features">
            <h3>🎨 设计元素</h3>
            <ul>
                <li><strong>射日元素:</strong> 橙色太阳 + 金色箭头 (象征后羿射日)</li>
                <li><strong>春节元素:</strong> 红灯笼、红包角标</li>
                <li><strong>服务图标:</strong> 美食碗、房屋、购物车、包裹</li>
                <li><strong>配色方案:</strong> 中国红 + 金色</li>
                <li><strong>尺寸:</strong> 64×64px (标准小程序图标)</li>
            </ul>
        </div>

        <button class="download-btn" onclick="downloadSVG()">📥 下载 SVG 文件</button>
    </div>

    <script>
        function downloadSVG() {
            const svg = document.querySelector('svg').outerHTML;
            const blob = new Blob([svg], {type: 'image/svg+xml'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'hede-cny-icon.svg';
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
