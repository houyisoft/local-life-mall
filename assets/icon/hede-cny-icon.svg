<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Rounded Square -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E63946;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C1121F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Main Background -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#bgGradient)" filter="url(#shadow)"/>

  <!-- Golden Decorative Border -->
  <rect x="4" y="4" width="56" height="56" rx="10" fill="none" stroke="#FFD700" stroke-width="1.5"/>

  <!-- Stylized Sun with Arrow (She Ri element) -->
  <g transform="translate(32, 26)">
    <!-- Sun Rays -->
    <circle cx="0" cy="0" r="14" fill="url(#sunGradient)" opacity="0.9"/>
    <!-- Golden Arrow -->
    <path d="M -3,-8 L 0,-12 L 3,-8 L 0,-4 Z" fill="#FFD700"/>
    <path d="M 0,-12 L 0,3" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
    <!-- Arrow Head -->
    <path d="M -2,0 L 0,4 L 2,0" fill="#FFD700"/>
  </g>

  <!-- Red Lantern (Top) -->
  <g transform="translate(32, 9)">
    <ellipse cx="0" cy="0" rx="3" ry="4" fill="#DC2626"/>
    <rect x="-1" y="-5" width="2" height="2" fill="#FFD700"/>
    <rect x="-1.5" y="4" width="3" height="1.5" fill="#FFD700" rx="0.5"/>
  </g>

  <!-- Four Service Icons (Bottom Row) -->
  <!-- Food Bowl (Local Cuisine) -->
  <g transform="translate(14, 46)">
    <path d="M -4,0 Q 0,-3 4,0 L 3,4 Q 0,5 -3,4 Z" fill="#FFD700" stroke="#C1121F" stroke-width="0.5"/>
    <circle cx="0" cy="1" r="1" fill="#C1121F"/>
  </g>

  <!-- House (Home Services) -->
  <g transform="translate(26, 46)">
    <path d="M 0,-3 L -4,1 L -3,1 L -3,4 L 3,4 L 3,1 L 4,1 Z" fill="#FFD700" stroke="#C1121F" stroke-width="0.5"/>
    <rect x="-1.5" y="2" width="3" height="2" fill="#C1121F"/>
  </g>

  <!-- Shopping Cart (Shopping) -->
  <g transform="translate(38, 46)">
    <path d="M -3,-2 L 3,-2 L 4,3 L -3,3 Z" fill="#FFD700" stroke="#C1121F" stroke-width="0.5"/>
    <circle cx="-1.5" cy="4" r="1" fill="#C1121F"/>
    <circle cx="2" cy="4" r="1" fill="#C1121F"/>
  </g>

  <!-- Package (Delivery) -->
  <g transform="translate(50, 46)">
    <rect x="-3" y="-2" width="6" height="5" fill="#FFD700" stroke="#C1121F" stroke-width="0.5" rx="0.5"/>
    <path d="M -1.5,-2 L -1.5,3" stroke="#C1121F" stroke-width="0.5"/>
  </g>

  <!-- Red Envelope Corner Badge (Top Right) -->
  <g transform="translate(54, 10)">
    <circle cx="0" cy="0" r="5" fill="#DC2626" stroke="#FFD700" stroke-width="1"/>
    <text x="0" y="1.5" font-family="Arial" font-size="6" fill="#FFD700" text-anchor="middle" font-weight="bold">¥</text>
  </g>

  <!-- Brand Text (Bottom) -->
  <text x="32" y="59" font-family="Microsoft YaHei, SimHei" font-size="5" fill="#FFD700" text-anchor="middle">合德生活</text>
</svg>